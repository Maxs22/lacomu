<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  role="img"
  aria-label="lacomu"
>
  <title>lacomu</title>

  <rect width="64" height="64" fill="#ffffff" />

  <!--
    Versión reducida del logo para favicon: TRES figuras, no cinco. Se
    verificó renderizando a 16/32px que con cinco las siluetas se pisan y
    quedan ilegibles a ese tamaño. Tres, más grandes y con más separación,
    siguen leyéndose como grupo.

    El stroke va fuera del transform de escala para que no se agrande junto
    con la figura.
  -->
  <g
    stroke="#ffffff"
    stroke-width="4"
    stroke-linejoin="round"
    paint-order="stroke"
  >
    <!-- izquierda · oliva -->
    <g transform="translate(15 54) scale(0.52)" fill="#7d8471">
      <path d="M -19 0 C -19 -30 -12 -40 0 -40 C 12 -40 19 -30 19 0 Z" />
      <circle cx="0" cy="-56" r="12" />
    </g>

    <!-- derecha · ocre -->
    <g transform="translate(49 54) scale(0.52)" fill="#b98b5e">
      <path d="M -19 0 C -19 -30 -12 -40 0 -40 C 12 -40 19 -30 19 0 Z" />
      <circle cx="0" cy="-56" r="12" />
    </g>

    <!-- centro · terracota (color primario de la marca) -->
    <g transform="translate(32 54) scale(0.62)" fill="#a83f21">
      <path d="M -19 0 C -19 -30 -12 -40 0 -40 C 12 -40 19 -30 19 0 Z" />
      <circle cx="0" cy="-56" r="12" />
    </g>
  </g>
</svg>
