<!--
  Template del email de ingreso (Supabase → Authentication → Email Templates → Magic Link).

  IMPORTANTE: la pantalla /ingresar pide un CÓDIGO numérico, no un link.
  El template por defecto de Supabase manda {{ .ConfirmationURL }} (un link),
  así que hay que reemplazarlo por este, que usa {{ .Token }}. Si el email
  llega con un link en vez del código, el login no se puede completar.

  Se guarda en el repo porque es parte del flujo de auth: si vive solo en el
  dashboard, nadie lo ve en el diff y se pierde en cualquier migración.

  Estilos inline a propósito: los clientes de email ignoran <style> y CSS
  externo. Sin variables CSS ni fuentes remotas por el mismo motivo.
-->
<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  style="background-color: #f5ecda; padding: 32px 16px; margin: 0"
>
  <tr>
    <td align="center">
      <table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        style="max-width: 440px; background-color: #fffbf2; border: 2px solid #e1d0ac; padding: 32px"
      >
        <tr>
          <td
            style="font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: bold; color: #271d14; padding-bottom: 24px"
          >
            lacomu<span style="color: #a83f21">.</span>
          </td>
        </tr>

        <tr>
          <td
            style="font-family: Georgia, 'Times New Roman', serif; font-size: 26px; line-height: 1.25; color: #271d14; padding-bottom: 12px"
          >
            Tu código para ingresar
          </td>
        </tr>

        <tr>
          <td
            style="font-family: Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.6; color: #5b4a37; padding-bottom: 24px"
          >
            Escribí este código en la pantalla donde lo pediste. Vence en una
            hora.
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-bottom: 24px">
            <div
              style="font-family: Georgia, 'Times New Roman', serif; font-size: 34px; font-weight: bold; letter-spacing: 10px; color: #a83f21; background-color: #f5ecda; border: 2px solid #e1d0ac; padding: 18px 12px"
            >
              {{ .Token }}
            </div>
          </td>
        </tr>

        <tr>
          <td
            style="font-family: Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.6; color: #5b4a37; border-top: 1px solid #e1d0ac; padding-top: 20px"
          >
            Si no pediste este código, podés ignorar este mail — sin ese
            código nadie puede entrar a tu cuenta.
          </td>
        </tr>
      </table>

      <table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        style="max-width: 440px; padding-top: 16px"
      >
        <tr>
          <td
            align="center"
            style="font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #5b4a37"
          >
            lacomu — hecho por
            <a href="https://spigcow.com.ar" style="color: #5b4a37">spigcow</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
